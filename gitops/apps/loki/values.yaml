loki:
  persistence:
    enabled: true
    size: 10Gi
    
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem
    filesystem:
      directory: /var/loki/chunks
  ingester:
    replicas: 1
    
read:
  replicas: 1

write:
  replicas: 1


