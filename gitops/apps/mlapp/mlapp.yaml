apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sittollsCM/devops-iitu-infra
    path: gitops/apps/mlapp
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mlapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RequeueAfterSeconds=60