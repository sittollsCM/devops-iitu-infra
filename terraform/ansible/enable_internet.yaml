- name: Wait until all VMs are accessible via SSH
  hosts: master, workers
  gather_facts: false
  vars:
    wait_interval: 5
    max_timeout: 120
  tasks:
    - name: Record start time
      set_fact:
        ssh_wait_start: "{{ lookup('pipe', 'date +%s') | int }}"
    - name: Wait for SSH (loop every 5s until reachable)
      wait_for_connection:
        delay: "{{ wait_interval }}"
        timeout: "{{ max_timeout }}"
      register: ssh_result
    - name: Calculate total wait time
      set_fact:
        ssh_wait_end: "{{ lookup('pipe', 'date +%s') | int }}"
      delegate_to: localhost
    - name: Show total wait duration
      debug:
        msg: >
          SSH enabled after {{

            ssh_wait_end | int - ssh_wait_start | int
          }} seconds.

- name: Enable internet access for libvirt VMs
  hosts: master, workers
  become: true
  vars:
    libvirt_subnet: "192.168.100.0/24"
    external_interface: "ens3"
  tasks:
    - name: Enable IP forwarding permanently
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        sysctl_set: yes
        reload: yes
    - name: Add NAT rule to iptables for libvirt subnet
      iptables:
        table: nat
        chain: POSTROUTING
        out_interface: "{{ external_interface }}"
        source: "{{ libvirt_subnet }}"
        jump: MASQUERADE
        state: present
    - name: Allow forwarding from libvirt network
      iptables:
        table: filter
        chain: FORWARD
        in_interface: virbr0
        out_interface: "{{ external_interface }}"
        jump: ACCEPT
        state: present
    - name: Allow established/related connections from external to libvirt
      iptables:
        table: filter
        chain: FORWARD
        in_interface: "{{ external_interface }}"
        out_interface: virbr0
        ctstate: RELATED,ESTABLISHED
        jump: ACCEPT
        state: present
