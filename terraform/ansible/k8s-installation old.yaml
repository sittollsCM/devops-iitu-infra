---
- name: Common Kubernetes node setup
  hosts: master, workers
  become: true
  vars:
    kube_version: "1.32.0"
  tasks:
    - name: Enable IPv4 forwarding
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.ipv4.ip_forward = 1
    - name: Apply sysctl settings
      command: sysctl --system

    - name: Install prerequisites for containerd
      apt:
        name:
          - ca-certificates
          - curl
        update_cache: yes

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename | lower }} stable

    - name: Install containerd
      apt:
        name: containerd.io
        update_cache: yes

    - name: Configure containerd cgroup driver
      copy:
        dest: /etc/containerd/config.toml
        content: |
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
            [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
              SystemdCgroup = true

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Add Kubernetes GPG key
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key | \
        gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repo
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /

    - name: Install Kubernetes tools
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        update_cache: yes

    - name: Hold kubelet, kubeadm, and kubectl
      apt:
        name: "{{ item }}"
        state: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet service
      systemd:
        name: kubelet
        enabled: yes
        state: started

- name: Initialize Kubernetes master
  hosts: master
  become: true
  tasks:
    - name: Pull kubeadm images
      command: kubeadm config images pull

    - name: Initialize the Kubernetes control plane
      command: kubeadm init --pod-network-cidr=10.244.0.0/16 --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      register: kubeadm_init
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Save kubeconfig for user
      shell: |
        mkdir -p $HOME/.kube
        cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
        chown $(id -u):$(id -g) $HOME/.kube/config
      when: kubeadm_init.changed

    - name: Export join command to file
      shell: kubeadm token create --print-join-command > /tmp/kubeadm_join.sh
      when: kubeadm_init.changed

    - name: Install weave network
      shell: kubectl apply -f https://reweave.azurewebsites.net/k8s/v1.29/net.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: kubeadm_init.changed

    - name: Patch weave net with IPALLOC_RANGE
      shell: |
        kubectl -n kube-system patch daemonset weave-net \
        --type='json' \
        -p='[{"op": "add", "path": "/spec/template/spec/containers/0/env/-", "value": {"name":"IPALLOC_RANGE","value":"10.244.0.0/16"}}]'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: kubeadm_init.changed

- name: Join worker nodes to Kubernetes cluster
  hosts: workers
  become: true
  tasks:
    - name: Get kubeadm join command
      slurp:
        src: /tmp/kubeadm_join.sh
      delegate_to: k8s_master
      register: join_script

    - name: Join the cluster
      shell: "{{ join_script['content'] | b64decode }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Install Helm on master
  hosts: master
  become: true
  tasks:
    - name: Install Helm
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm
