- name: Common Kubernetes node setup
  hosts: master, workers
  become: true
  vars:
    kube_version: "1.32.0"
  tasks:
    - name: 1. Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes
    - name: 2. Install prerequisites for containerd
      apt:
        name:
          - ca-certificates
          - curl
        update_cache: yes
    - name: 3. Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
    - name: 4. Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename | lower }} stable
    - name: 5. Install containerd
      apt:
        name: containerd.io
        update_cache: yes
    - name: 6. Configure containerd cgroup driver
      copy:
        dest: /etc/containerd/config.toml
        content: |
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
            [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
              SystemdCgroup = true
    - name: 7. Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true
    - name: 8. Add Kubernetes GPG key
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key | \
        gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    - name: 9. Add Kubernetes apt repo
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /
    - name: 10. Install Kubernetes tools
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        update_cache: yes
    - name: 11. Hold kube packages to prevent upgrades
      ansible.builtin.shell: |
        echo "{{ item }} hold" | sudo dpkg --set-selections
      loop:
        - kubelet
        - kubeadm
        - kubectl
    - name: 12. Enable kubelet service
      systemd:
        name: kubelet
        enabled: yes
        state: started
    - name: 13. Create crictl config for containerd
      copy:
        dest: /etc/crictl.yaml
        content: |
          runtime-endpoint: unix:///run/containerd/containerd.sock
          image-endpoint: unix:///run/containerd/containerd.sock
          timeout: 10
          debug: false
      become: true
- name: Initialize Kubernetes master
  hosts: master
  become: true
  tasks:
    - name: 1. Pull kubeadm images
      shell: >
        kubeadm config images pull --image-repository=registry.k8s.io --cri-socket=unix:///run/containerd/containerd.sock

      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
    - name: 2. Get list of kubeadm images
      command: kubeadm config images list
      register: image_list_raw
    - name: 3. Create image directory
      file:
        path: "{{ image_dir }}"
        state: directory
    - name: 4. Save each image as tarball using ctr
      shell: |
        ctr -n k8s.io images pull {{ item }}
        ctr -n k8s.io images export {{ image_dir }}/{{ item | regex_replace('[^a-zA-Z0-9]', '_') }}.tar {{ item }}
      args:
        executable: /bin/bash
      loop: "{{ image_list_raw.stdout_lines }}"
    - name: 5. Copy tar files to workers
      synchronize:
        src: "{{ image_dir }}/"
        dest: "{{ image_dir }}/"
        mode: push
      delegate_to: "{{ item }}"
      loop: "{{ groups['workers'] }}"
    - name: Disable swap (temporary)
      command: swapoff -a
    - name: 6. Initialize the Kubernetes control plane
      command: kubeadm init --apiserver-advertise-address={{ ansible_default_ipv4.address }} {{ kubeadm_init_flags }}
      register: kubeadm_init
      args:
        creates: /etc/kubernetes/admin.conf
    - name: 7. Save kubeconfig for user
      shell: |
        mkdir -p $HOME/.kube
        cp -f /etc/kubernetes/admin.conf $HOME/.kube/config
        chown $(id -u):$(id -g) $HOME/.kube/config
      when: kubeadm_init is succeeded
    - name: 8. Export join command to file
      shell: kubeadm token create --print-join-command > /tmp/kubeadm_join.sh
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: kubeadm_init is succeeded
    - name: 9. Wait for API server to be available
      uri:
        url: https://127.0.0.1:6443/healthz
        method: GET
        validate_certs: no
        status_code: 200
      register: api_server_status
      retries: 20
      delay: 5
      until: api_server_status.status == 200
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: kubeadm_init is succeeded
    - name: 10. Install Calico CNI plugin
      shell: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: kubeadm_init is succeeded and api_server_status.status == 200
- name: Join worker nodes to Kubernetes cluster
  hosts: workers
  serial: 1
  become: true
  tasks:
    - name: 1. Import all preloaded images
      shell: |
        for tar in {{ image_dir }}/*.tar; do
          ctr -n k8s.io images import "$tar"
        done
      args:
        executable: /bin/bash
    - name: 2. Check if node is already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: node_joined
    - name: 3. Get kubeadm join command
      command: kubeadm token create --print-join-command
      register: join_command_raw
      delegate_to: "{{ groups['master'][0] }}"
      run_once: true
      when: not node_joined.stat.exists
    - name: 4. Set join_script variable
      set_fact:
        join_script: "{{ join_command_raw.stdout }}"
      run_once: true
      when: not node_joined.stat.exists
    - name: 5. Print join command (debug)
      debug:
        var: join_script
      run_once: true
      when: not node_joined.stat.exists
    - name: Disable swap (temporary)
      command: swapoff -a
    - name: 6. Join the cluster
      command: "{{ join_script }} --ignore-preflight-errors=all"
      when: not node_joined.stat.exists
- name: Install Helm on master
  hosts: master
  become: true
  tasks:
    - name: 1. Install Helm
      get_url:
        url: https://get.helm.sh/helm-v3.13.2-linux-amd64.tar.gz
        dest: /tmp/helm.tar.gz
    - name: 2. Extract Helm
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: yes
    - name: 3. Move Helm binary
      copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: '0755'
        remote_src: yes
