#cloud-config
hostname: ${hostname}
ssh_authorized_keys:
  - ${ssh_key}

bootcmd:
  - [ sh, -c, "echo '${hosts_string}' >> /etc/hosts" ]

runcmd:
  - [ ls, -l, / ]
  - [ sh, -xc, "echo $(date) ': hello world!'" ]

ssh_pwauth: true
disable_root: false

chpasswd:
  list: |
    root:password
    ubuntu:ubuntu
  expire: false

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    home: /home/ubuntu
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ${ssh_key}

final_message: "The system is finally up, after $UPTIME seconds"
